<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CETEP Raso da Catarina</title>
<meta name="description" content="Cursos técnicos profissionalizantes do CETEP Raso da Catarina, em Jeremoabo, Bahia.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#conteudo">Ir para o conteúdo</a>

<div class="govbar"><div class="wrap" id="govTexto"></div></div>

<header class="topo">
  <div class="wrap topo-in">
    <a class="marca" href="#inicio">
      <span class="marca-sigla" id="sigla"></span>
      <span><strong id="nomeEscola"></strong><small id="local"></small></span>
    </a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menu">Menu</button>
    <nav class="menu" id="menu" aria-label="Menu principal">
      <a href="#inicio">Início</a>
      <a href="#cursos">Cursos</a>
      <a href="#noticias">Notícias</a>
      <a href="#escola">Nossa escola</a>
      <a href="#contato">Contato</a>
    </nav>
  </div>
</header>

<main id="conteudo">
  <section class="banner" id="inicio" aria-roledescription="carrossel" aria-label="Destaques">
    <div class="slides" id="slides"></div>
    <button class="seta ant" id="ant" aria-label="Slide anterior">&lsaquo;</button>
    <button class="seta prox" id="prox" aria-label="Próximo slide">&rsaquo;</button>
    <div class="pontos" id="pontos"></div>
  </section>

  <section class="wrap">
    <h2>Acesso rápido</h2>
    <div class="grid" id="acesso"></div>
  </section>

  <section class="wrap" id="cursos">
    <h2>Cursos técnicos</h2>
    <div class="filtros" id="filtros"></div>
    <div class="grid" id="cursosGrid"></div>
  </section>

  <section class="faixa" id="noticias">
    <div class="wrap">
      <h2>Notícias</h2>
      <ul class="noticias" id="noticiasLista"></ul>
    </div>
  </section>

  <section class="wrap sobre" id="escola">
    <h2>Nossa escola</h2>
    <p id="sobreTexto"></p>
  </section>
</main>

<footer id="contato"><div class="wrap" id="rodape"></div></footer>

<dialog id="dlg" aria-labelledby="dlgTitulo">
  <button class="fechar" aria-label="Fechar">&times;</button>
  <div id="dlgConteudo"></div>
</dialog>

<script src="script.js"></script>
</body>
</html>
